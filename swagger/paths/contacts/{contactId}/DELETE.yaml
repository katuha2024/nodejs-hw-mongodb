tags:
  - Contacts
summary: Delete a contact by ID
operationId: deleteContact
description: Deletes a contact by its unique identifier.
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    required: true
    description: Unique ID of the contact
    schema:
      type: string
responses:
  "204":
    description: Contact deleted successfully (no content)

  "401":
    description: Unauthorized — missing or invalid token
    content:
      application/json:
        schema:
          type: object
          required: [status, message, data]
          properties:
            status:
              type: integer
              example: 401
            message:
              type: string
              example: Not authorized
            data:
              type: object
              example: {}

  "404":
    description: Contact not found
    content:
      application/json:
        schema:
          type: object
          required: [status, message, data]
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: Contact not found
            data:
              type: object
              example: {}
