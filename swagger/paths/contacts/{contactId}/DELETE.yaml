tags:
  - Contacts
summary: Delete a contact by ID
operationId: deleteContact
description: Deletes a contact by its unique identifier.
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    required: true
    description: Unique ID of the contact
    schema:
      type: string
responses:
  '204':
    description: Contact deleted successfully (no content)
  '404':
    description: Contact not found
