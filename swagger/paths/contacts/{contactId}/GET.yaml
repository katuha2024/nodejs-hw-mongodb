tags:
  - Contacts
summary: Retrieve a contact by ID
operationId: getContactById
description: Returns a contact by its unique identifier.
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    required: true
    description: Unique ID of the contact
    schema:
      type: string
responses:
  "200":
    description: Contact found successfully
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contact with id 646dbf9e8f1a2c0012345678!
            data:
              $ref: '../../../components/schemas/Contact.yaml'

  "404":
    description: Contact not found
    content:
      application/json:
        schema:
          type: object
          required: [status, message, data]
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: Contact not found
            data:
              type: object
              example: Contact not found
