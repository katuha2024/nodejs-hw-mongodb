tags:
  - Contacts
summary: Update contact photo
operationId: updateContactPhoto
description: Updates the photo of a contact.
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
    description: Contact ID
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - photo
        properties:
          photo:
            type: string
            format: binary
            description: Contact photo file
responses:
  "200":
    description: Photo updated successfully
    content:
      application/json:
        schema:
          type: object
          required: [status, message, data]
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact
            data:
              $ref: '../../../components/schemas/Contact.yaml'

  "400":
    description: No file uploaded
    content:
      application/json:
        schema:
          type: object
          required: [status, message, data]
          properties:
            status:
              type: integer
              example: 400
            message:
              type: string
              example: No file uploaded
            data:
              type: object
              example: {}

  "404":
    description: Contact not found
    content:
      application/json:
        schema:
          type: object
          required: [status, message, data]
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: Contact not found
            data:
              type: object
              example: {}
