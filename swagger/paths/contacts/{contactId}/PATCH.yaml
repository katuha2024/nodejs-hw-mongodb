tags:
  - Contacts
summary: Update an existing contact
operationId: updateContact
description: Updates contact fields. At least one field must be provided.
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
    description: Contact ID
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            minLength: 3
            maxLength: 20
            example: "Jane Doe"
          phoneNumber:
            type: string
            minLength: 3
            maxLength: 20
            example: "+987654321"
          email:
            type: string
            format: email
            minLength: 3
            maxLength: 20
            example: "jane@example.com"
          isFavourite:
            type: boolean
            example: true
          contactType:
            type: string
            enum: [personal, home, work]
            example: "personal"
responses:
  "200":
    description: Contact successfully updated
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Contact successfully updated
            data:
              $ref: '../../../components/schemas/Contact.yaml'
  "400":
    description: Validation error
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 400
            message:
              type: string
              example: Validation error
            data:
              type: object
              example: {}
  "404":
    description: Contact not found
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: Contact not found
            data:
              type: object
              example: {}
