tags:
  - Contacts
summary: Get all contacts
operationId: handleGetAllContacts
description: Returns a paginated list of contacts for the authenticated user.
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    required: false
    schema:
      type: integer
      default: 1
    description: Page number for pagination.
  - name: perPage
    in: query
    required: false
    schema:
      type: integer
      default: 10
    description: Number of contacts per page.
  - name: sortBy
    in: query
    required: false
    schema:
      type: string
      default: name
    description: Field to sort by.
  - name: sortOrder
    in: query
    required: false
    schema:
      type: string
      enum: [asc, desc]
      default: asc
    description: Sort order.
  - name: type
    in: query
    required: false
    schema:
      type: string
    description: Filter contacts by type.
  - name: isFavourite
    in: query
    required: false
    schema:
      type: boolean
    description: Filter contacts by favourite status.
responses:
  '200':
    description: Successfully found contacts
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: array
              items:
                $ref: ../../components/schemas/Contact.yaml
  '401':
    description: Unauthorized - Authentication required
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 401
            message:
              type: string
              example: Unauthorized
