tags:
  - Contacts
summary: Get all contacts
operationId: handleGetAllContacts
description: Returns a paginated list of contacts for the authenticated user.
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    schema:
      type: integer
      default: 1
    description: Page number for pagination.
  - name: perPage
    in: query
    schema:
      type: integer
      default: 10
    description: Number of contacts per page.
  - name: sortBy
    in: query
    schema:
      type: string
      default: name
    description: Field to sort by.
  - name: sortOrder
    in: query
    schema:
      type: string
      enum: [asc, desc]
      default: asc
    description: Sort order.
  - name: type
    in: query
    schema:
      type: string
    description: Filter contacts by type.
  - name: isFavourite
    in: query
    schema:
      type: boolean
    description: Filter contacts by favourite status.
responses:
  '200':
    description: Successfully found contacts
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              required:
                - data
                - page
                - perPage
                - totalItems
                - totalPages
                - hasPreviousPage
                - hasNextPage
              properties:
                data:
                  type: array
                  items:
                    $ref: ../../components/schemas/Contact.yaml
                page:
                  type: integer
                  example: 1
                perPage:
                  type: integer
                  example: 10
                totalItems:
                  type: integer
                  example: 42
                totalPages:
                  type: integer
                  example: 5
                hasPreviousPage:
                  type: boolean
                  example: false
                hasNextPage:
                  type: boolean
                  example: true
  '401':
    description: Unauthorized - Authentication required
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 401
            message:
              type: string
              example: Unauthorized
            data:
              type: object
              example: {}
