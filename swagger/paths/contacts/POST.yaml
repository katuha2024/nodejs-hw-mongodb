tags:
  - Contacts
summary: Create a new contact
operationId: createContact
description: Creates a new contact for the authenticated user.
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
          email:
            type: string
            format: email
          phone:
            type: string
          type:
            type: string
          isFavourite:
            type: boolean
          photo:
            type: string
            format: binary
responses:
  '201':
    description: Successfully created a contact
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/Contact.yaml
  '400':
    description: Bad Request - Invalid input
    content:
      application/json:
        schema:
          type: object
          properties:
            message:
              type: string
