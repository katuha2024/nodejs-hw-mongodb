tags:
  - Contacts
summary: Create a new contact
operationId: createContact
description: Creates a new contact with required fields.
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            type: string
            minLength: 3
            maxLength: 20
            example: "John Doe"
          phoneNumber:
            type: string
            minLength: 3
            maxLength: 20
            example: "+123456789"
          email:
            type: string
            format: email
            minLength: 3
            maxLength: 20
            example: "john@example.com"
          isFavourite:
            type: boolean
            example: false
          contactType:
            type: string
            enum: [personal, home, work]
            example: "work"
responses:
  "201":
    description: Contact successfully created
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Contact successfully created
            data:
              $ref: '../../components/schemas/Contact.yaml'
  "400":
    description: Validation error
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 400
            message:
              type: string
              example: Validation error
            data:
              type: object
              example: {}
